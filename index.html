<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Takip Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .card { background-color: #1e293b; border-radius: 1.5rem; padding: 2rem; width: 100%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        input { background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.75rem; padding: 1rem; width: 100%; margin-bottom: 1rem; outline: none; }
        .btn-primary { background: linear-gradient(to right, #f59e0b, #d97706); color: white; font-weight: bold; padding: 1rem; border-radius: 0.75rem; width: 100%; border: none; cursor: pointer; }
        .hidden { display: none !important; }
        .history-item { background: #0f172a; padding: 10px; border-radius: 8px; border-left: 4px solid #f59e0b; margin-bottom: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="login-screen" class="w-full p-4">
        <div class="card mx-auto text-center">
            <h1 class="text-3xl font-black mb-6 text-orange-400 italic">OTO TAKİP PRO</h1>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn-primary" onclick="login()">SİSTEME GİRİŞ</button>
            <p class="text-[10px] text-gray-500 mt-4">İlk giriş: mehmet / 5555</p>
        </div>
    </div>

    <div id="main-app" class="hidden w-full max-w-md p-4 mt-10">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-orange-400">OTO TAKİP</h2>
            <button onclick="location.reload()" class="text-xs text-red-400 border border-red-900/50 px-2 py-1 rounded">Çıkış</button>
        </div>

        <div class="card !max-w-none mb-6">
            <input type="text" id="plate" placeholder="PLAKA GİRİNİZ" class="uppercase" oninput="checkHistory(this.value)">
            
            <div id="history-box" class="hidden mb-4 p-3 bg-slate-900 rounded-lg max-h-40 overflow-y-auto">
                <p class="text-[10px] text-orange-400 mb-2 font-bold uppercase">Müşteri Geçmişi</p>
                <div id="history-list"></div>
            </div>

            <input type="number" id="price" placeholder="Tutar (₺)">
            <button class="btn-primary" onclick="save()">KAYDET</button>
        </div>

        <div id="admin-panel" class="hidden space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-around text-center">
                <div><p class="text-[10px] text-gray-500 uppercase">Ciro</p><p class="text-green-400 font-bold" id="total-money">0₺</p></div>
                <div><p class="text-[10px] text-gray-500 uppercase">Adet</p><p class="text-blue-400 font-bold" id="total-count">0</p></div>
            </div>
        </div>
    </div>

    <script>
        // GÖRSELDEKİ BİLGİLERİNİ BURAYA İŞLEDİM
        const firebaseConfig = {
            apiKey: "AIzaSyCnlxjPmgl857-v_j-gxATkKDiipA8",
            authDomain: "plaka-pro-v3.firebaseapp.com",
            projectId: "plaka-pro-v3",
            storageBucket: "plaka-pro-v3.firebasestorage.app",
            messagingSenderId: "994854855186",
            appId: "1:994854855186:web:231dd6f0d53cce77f153a5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let activeUser = null;

        async function login() {
            const u = document.getElementById('username').value.toLowerCase().trim();
            const p = document.getElementById('password').value.trim();

            if (u === "mehmet" && p === "5555") {
                activeUser = { name: "mehmet", role: "admin" };
                await db.collection("users").doc("mehmet").set({ pass: "5555", role: "admin" });
                startApp();
            } else {
                const doc = await db.collection("users").doc(u).get();
                if (doc.exists && doc.data().pass === p) {
                    activeUser = { name: u, role: doc.data().role };
                    startApp();
                } else { alert("Hatalı giriş!"); }
            }
        }

        function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.body.style.alignItems = "flex-start";
            if(activeUser.role === 'admin') {
                document.getElementById('admin-panel').classList.remove('hidden');
                updateStats();
            }
        }

        async function checkHistory(val) {
            if(val.length < 4) { document.getElementById('history-box').classList.add('hidden'); return; }
            const snap = await db.collection("logs").where("plate", "==", val.toUpperCase()).orderBy("date", "desc").get();
            const list = document.getElementById('history-list');
            document.getElementById('history-box').classList.remove('hidden');
            
            if(snap.empty) { list.innerHTML = "<p class='text-xs text-green-400'>✨ Yeni Araç</p>"; }
            else {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    const date = data.date ? new Date(data.date.seconds * 1000).toLocaleDateString('tr-TR') : 'Bugün';
                    h += `<div class="history-item"><b>${date}</b><br>${data.price}₺ işlem yapıldı.</div>`;
                });
                list.innerHTML = h;
            }
        }

        function save() {
            const pl = document.getElementById('plate').value.toUpperCase().trim();
            const pr = Number(document.getElementById('price').value);
            if(!pl || !pr) return;

            db.collection("logs").add({
                plate: pl, price: pr, date: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { alert("Kaydedildi!"); location.reload(); });
        }

        function updateStats() {
            db.collection("logs").get().then(snap => {
                let total = 0;
                snap.forEach(d => total += d.data().price);
                document.getElementById('total-money').innerText = total + "₺";
                document.getElementById('total-count').innerText = snap.size;
            });
        }
    </script>
</body>
</html>

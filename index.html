<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oto Takip - Müşteri Geçmişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .card { background-color: #1e293b; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        input, select { background-color: #334155; border: 1px solid #475569; color: white; border-radius: 0.5rem; padding: 0.75rem; width: 100%; margin-bottom: 1rem; }
        .btn-primary { background: linear-gradient(to right, #f59e0b, #d97706); color: white; font-weight: bold; padding: 1rem; border-radius: 0.5rem; width: 100%; }
        .history-item { background-color: #0f172a; border-left: 4px solid #f59e0b; padding: 8px; margin-bottom: 5px; border-radius: 4px; font-size: 11px; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        
        <div id="login-screen" class="mt-20">
            <h2 class="text-3xl font-bold text-center mb-8 text-orange-400 italic">OTO TAKİP PRO</h2>
            <div class="card">
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <input type="password" id="password" placeholder="Şifre">
                <button class="btn-primary" onclick="login()">SİSTEME GİRİŞ</button>
            </div>
        </div>

        <div id="app-content" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-bold text-orange-400">OTO TAKİP</h2>
                    <p id="user-display" class="text-[10px] text-gray-400 font-mono uppercase"></p>
                </div>
                <button onclick="location.reload()" class="text-xs text-red-400 border border-red-900/50 px-2 py-1 rounded">Çıkış</button>
            </div>

            <div class="card mb-6">
                <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase">Araç Sorgula / Kaydet</h3>
                <input type="text" id="plate" placeholder="PLAKA GİRİNİZ" oninput="checkPlateHistory(this.value)">
                
                <div id="customer-card" class="hidden mb-4 p-3 bg-slate-800 rounded-lg border border-orange-500/30">
                    <p class="text-xs font-bold text-orange-400 mb-2">🚗 ARAÇ GEÇMİŞİ:</p>
                    <div id="history-list" class="max-h-40 overflow-y-auto">
                        </div>
                </div>

                <select id="service">
                    <option value="İç-Dış Yıkama">İç-Dış Yıkama</option>
                    <option value="Sadece Dış">Sadece Dış</option>
                    <option value="Motor Temizleme">Motor Temizleme</option>
                    <option value="Detaylı Temizlik">Detaylı Temizlik</option>
                    <option value="Pasta Cila">Pasta Cila</option>
                </select>
                <input type="number" id="price" placeholder="Tutar (₺)">
                <button class="btn-primary" onclick="saveRecord()">KAYDI TAMAMLA</button>
            </div>

            <div id="admin-section" class="hidden">
                <button class="w-full bg-slate-700 text-slate-300 py-3 rounded-lg font-bold text-sm mb-6 border border-slate-600" onclick="toggleAdminPanel()">
                    📊 CİRO VE GENEL RAPORLAR
                </button>

                <div id="admin-panel" class="hidden card bg-black/30 border border-orange-500/20 mb-10">
                    <div class="grid grid-cols-2 gap-2 mb-6 text-center text-[10px]">
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-gray-500 italic">BUGÜN TOPLAM</p>
                            <p class="text-green-400 font-bold text-lg" id="total-income">0₺</p>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <p class="text-gray-500 italic">İŞLEM SAYISI</p>
                            <p class="text-blue-400 font-bold text-lg" id="total-count">0</p>
                        </div>
                    </div>
                    
                    <h4 class="text-xs font-bold mb-3 text-gray-500 uppercase">Tüm İşlemler (Son 50)</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[10px] text-left">
                            <tbody id="log-table" class="text-gray-300"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // KULLANICI YÖNETİMİ
        const users = {
            "mehmet": { pass: "5555", role: "admin" },
            "calisan1": { pass: "1234", role: "worker" }
        };

        // FIREBASE AYARLARINI BURAYA YAPIŞTIR
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "plaka-pro-v3.firebaseapp.com",
            projectId: "plaka-pro-v3",
            storageBucket: "...",
            messagingSenderId: "...",
            appId: "..."
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let activeUser = null;

        function login() {
            const u = document.getElementById('username').value.toLowerCase();
            const p = document.getElementById('password').value;
            if (users[u] && users[u].pass === p) {
                activeUser = { name: u, role: users[u].role };
                startApp();
            } else { alert("Hatalı Giriş!"); }
        }

        function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('user-display').innerText = "GÖREVLİ: " + activeUser.name;
            if (activeUser.role === "admin") {
                document.getElementById('admin-section').classList.remove('hidden');
                loadAdminData();
            }
        }

        // 🔍 GELİŞMİŞ PLAKA SORGULAMA (GEÇMİŞİ GÖSTERİR)
        async function checkPlateHistory(val) {
            const historyList = document.getElementById('history-list');
            const customerCard = document.getElementById('customer-card');
            
            if(val.length < 4) {
                customerCard.classList.add('hidden');
                return;
            }

            const snap = await db.collection("logs")
                               .where("plate", "==", val.toUpperCase())
                               .orderBy("date", "desc")
                               .get();

            if (snap.empty) {
                customerCard.classList.remove('hidden');
                historyList.innerHTML = `<p class="text-green-400 text-xs italic">✨ Bu araç sistemde kayıtlı değil, İLK GELİŞİ.</p>`;
            } else {
                customerCard.classList.remove('hidden');
                let html = `<p class="text-white text-xs mb-2">Bu araç toplam <b>${snap.size} kez</b> geldi:</p>`;
                
                snap.forEach(doc => {
                    const d = doc.data();
                    const dt = d.date ? new Date(d.date.seconds * 1000).toLocaleString('tr-TR') : 'Yeni Kayıt';
                    html += `
                        <div class="history-item">
                            <span class="text-orange-300">${dt}</span><br>
                            <span>${d.service} - <b>${d.price}₺</b></span>
                        </div>`;
                });
                historyList.innerHTML = html;
            }
        }

        function saveRecord() {
            const plate = document.getElementById('plate').value.toUpperCase();
            const service = document.getElementById('service').value;
            const price = Number(document.getElementById('price').value);
            if(!plate || !price) { alert("Lütfen plaka ve fiyat girin!"); return; }

            db.collection("logs").add({
                plate: plate, service: service, price: price,
                worker: activeUser.name,
                date: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'income'
            }).then(() => { alert("Başarıyla Kaydedildi!"); location.reload(); });
        }

        function toggleAdminPanel() {
            document.getElementById('admin-panel').classList.toggle('hidden');
        }

        function loadAdminData() {
            db.collection("logs").orderBy("date", "desc").limit(50).get().then((snap) => {
                let income = 0; let count = 0; let html = "";
                snap.forEach((doc) => {
                    const d = doc.data();
                    if(d.type === 'income') {
                        income += d.price;
                        count++;
                        html += `<tr class="border-b border-slate-800"><td class="py-2 font-bold">${d.plate}</td><td>${d.service}</td><td class="text-right text-green-400">${d.price}₺</td></tr>`;
                    }
                });
                document.getElementById('total-income').innerText = income + "₺";
                document.getElementById('total-count').innerText = count;
                document.getElementById('log-table').innerHTML = html;
            });
        }
    </script>
</body>
</html>
